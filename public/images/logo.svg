    @keyframes signal { 0%, 6% { fill: #fecaca; } 14%, 100% { fill: #dc2626; } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0.4px #ef4444); } 12% { filter: drop-shadow(0 0 1.6px #f87171) brightness(1.25); } }
    @media (prefers-reduced-motion: reduce) { .trace rect, .lamp { animation: none; } }
  </style>
